spec_version: "0.1.0"
name: sbom-reachability-mitigation-engine
version: 1.0.0
description: Builds whole-program call graphs to differentiate directly reachable third-party CVE call sites from benign uninvoked package dependencies.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - callgraph-reachability-analysis
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - cybersecurity
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/sbom-reachability-mitigation-engine"
